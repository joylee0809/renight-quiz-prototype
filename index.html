<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Renight | Redesign your day</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
<style>
:root{
  --bg:#0F0F0F; --card:rgba(29,30,33,.5); --inner:#25262A; --line:rgba(255,255,255,.1);
  --t1:#FAFAFA; --t2:#CFCFCF; --t3:#A5A5A5; --t4:#8F8F8F; --t5:#646464;
  --blue:#4876EE; --lblue:#A2C4FF; --sun:#FFC982; --sun2:#FFE9C2;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:#050505;height:100%}
body{font-family:"Plus Jakarta Sans","Pretendard",system-ui,sans-serif;font-weight:500;color:var(--t1);line-height:1.333;-webkit-font-smoothing:antialiased}
body.ko{font-family:"Pretendard","Plus Jakarta Sans",system-ui,sans-serif;word-break:keep-all}
#phone{position:relative;max-width:440px;min-height:100dvh;margin:0 auto;background:var(--bg);overflow:hidden}
#phone::before{content:"";position:absolute;left:50%;top:-260px;width:560px;height:420px;transform:translateX(-50%);background:radial-gradient(closest-side,rgba(72,118,238,.55),rgba(72,118,238,0));pointer-events:none}
#phone::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.08;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.screen{position:relative;z-index:1;min-height:100dvh;display:flex;flex-direction:column;justify-content:space-between;gap:28px;padding:56px 24px 36px;animation:in .35s ease-out}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.top{display:flex;flex-direction:column;gap:24px}
.bottom{display:flex;flex-direction:column;gap:12px;align-items:center}
.header{display:flex;align-items:center;gap:12px;min-height:24px}
.back{width:24px;height:24px;border:0;background:none;cursor:pointer;display:grid;place-items:center}
.progress{flex:1;height:4px;border-radius:2px;background:var(--inner);overflow:hidden}
.progress i{display:block;height:100%;border-radius:2px;background:linear-gradient(90deg,var(--blue),var(--lblue));transition:width .5s ease}
.x{margin-left:auto}
h1,.h1{font-weight:600;font-size:28px;line-height:1.3;background:linear-gradient(90deg,#FAFAFA,#A2C4FF);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 12px rgba(72,118,238,.18))}
h1.big{font-size:42px;line-height:1.2}
.sub{font-size:16px;color:var(--t3)}
.body{font-size:16px;color:var(--t2)}
.eyebrow{font-size:13px;letter-spacing:.06em;color:var(--lblue);text-transform:uppercase}
.ko .eyebrow{text-transform:none;letter-spacing:0}
.q{display:flex;flex-direction:column;gap:10px}
.btn{width:100%;height:57px;border:0;border-radius:999px;background:rgba(72,118,238,.85);color:var(--t1);font:inherit;font-size:16px;cursor:pointer;transition:transform .1s,opacity .2s}
.btn:active{transform:scale(.98)}
.btn[disabled]{background:rgba(72,118,238,.4);color:rgba(250,250,250,.5);cursor:default}
.link{background:none;border:0;color:var(--t3);font:inherit;font-size:14px;cursor:pointer;padding:6px}
.link.blue{color:var(--lblue)}
.note{font-size:14px;color:var(--t4);text-align:center}
.left{font-size:14px;color:var(--lblue);text-align:center}
.opts{display:flex;flex-direction:column;gap:12px}
.opt{display:flex;align-items:center;gap:14px;width:100%;padding:18px 18px 18px 20px;border-radius:16px;border:1px solid var(--line);background:rgba(29,30,33,.6);backdrop-filter:blur(4px);color:var(--t1);font:inherit;font-size:16px;text-align:left;cursor:pointer;transition:background .15s,border-color .15s,transform .1s}
.opt:active{transform:scale(.99)}
.opt span{flex:1}
.opt .r{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--t5);flex:none;display:grid;place-items:center;transition:all .15s}
.opt.on{border:1.5px solid var(--blue);background:rgba(72,118,238,.16)}
.opt.on .r{background:var(--blue);border-color:var(--blue)}
.opt.on .r::after{content:"";width:9px;height:5px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
.opt.multi .r{border-radius:6px}
.opts.locked .opt{pointer-events:none}
.opts.locked .opt:not(.on){opacity:.45}
.glass{border-radius:20px;border:1px solid var(--line);background:var(--card);backdrop-filter:blur(16px);padding:20px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--inner);color:var(--t2);font-size:14px;width:max-content}
.empathy{border-radius:16px;border:1px solid rgba(162,196,255,.35);background:var(--card);padding:12px 18px;display:flex;flex-direction:column;gap:4px;animation:up .35s ease-out}
.empathy p{font-size:15px}.empathy small{font-size:13px;color:var(--t4)}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
/* day band */
.band{position:relative;display:flex;justify-content:space-between;padding-top:2px}
.band::before{content:"";position:absolute;left:10%;right:8%;top:7px;height:2px;opacity:.7;background:linear-gradient(90deg,var(--sun),var(--sun2) 35%,var(--lblue) 70%,var(--blue))}
.band div{position:relative;display:flex;flex-direction:column;align-items:center;gap:10px;font-size:14px;color:var(--t4)}
.band b{width:12px;height:12px;border-radius:50%}
/* wheel */
.wheel{position:relative;height:300px;margin-top:8px}
.wheel .list{height:100%;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding:120px 0;overscroll-behavior:contain}
.wheel .list::-webkit-scrollbar{display:none}
.wheel .it{height:60px;display:grid;place-items:center;scroll-snap-align:center;font-size:22px;color:var(--t5);transition:color .15s,font-size .15s;cursor:pointer;user-select:none}
.wheel .it.n1{color:var(--t4);font-size:24px}
.wheel .it.on{color:var(--t1);font-size:30px}
.wheel .bandsel{position:absolute;left:0;right:0;top:120px;height:60px;border:1.5px solid var(--blue);border-radius:16px;background:rgba(255,255,255,.04);pointer-events:none}
.wheel .list{-webkit-mask-image:linear-gradient(transparent,#000 38%,#000 62%,transparent);mask-image:linear-gradient(transparent,#000 38%,#000 62%,transparent)}
/* charts */
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.draw{animation:draw 1.6s cubic-bezier(.45,0,.25,1) .3s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.fadein{opacity:0;animation:fade .5s ease 1.7s forwards}
@keyframes fade{to{opacity:1}}
.axis{display:flex;justify-content:space-between;font-size:13px;color:var(--t4);margin-top:6px}
.marker{position:absolute;padding:4px 10px;border-radius:999px;background:var(--inner);font-size:13px;color:var(--t1);white-space:nowrap;transform:translate(-50%,0)}
/* chain */
.chain{position:relative;display:flex;flex-direction:column;gap:13px}
.crow{display:flex;gap:14px;padding:10px 0}
.crow i{width:10px;height:10px;border-radius:50%;flex:none;margin-top:6px}
.crow small{display:block;font-size:14px;color:var(--t3)}.crow p{font-size:18px}
.arrow{position:absolute;left:0;width:10px;display:flex;justify-content:center}
/* compare */
.cmp{display:flex;gap:16px;align-items:flex-start}
.cmp>div{flex:1;display:flex;flex-direction:column;gap:10px}
.barbox{height:96px;display:flex;align-items:flex-end}
.bar{width:100%;border-radius:12px 12px 4px 4px;height:0;transition:height .9s cubic-bezier(.2,.8,.2,1)}
.cmp p{font-size:16px}.cmp small{font-size:14px;color:var(--t3)}
/* loading */
.ring{position:relative;width:168px;height:168px;margin:12px auto 0}
.ring svg{transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-weight:600;font-size:40px}
.steps{display:flex;flex-direction:column;gap:8px}
.step{display:flex;gap:10px;align-items:center;font-size:16px;color:var(--t5);transition:color .3s}
.step i{width:20px;height:20px;border-radius:50%;border:1.5px dashed var(--t5);display:grid;place-items:center;transition:all .3s}
.step.done{color:var(--t1)}
.step.done i{border:0;background:rgba(72,118,238,.25)}
.step.done i::after{content:"";width:8px;height:4px;border-left:2px solid var(--lblue);border-bottom:2px solid var(--lblue);transform:rotate(-45deg) translate(1px,-1px)}
.dim{position:fixed;inset:0;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .35s;z-index:5}
.dim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;width:100%;max-width:440px;transform:translate(-50%,105%);transition:transform .4s cubic-bezier(.2,.8,.2,1);z-index:6;border-radius:28px 28px 0 0;border:1px solid var(--line);background:rgba(29,30,33,.92);backdrop-filter:blur(24px);padding:28px 24px 36px;display:flex;flex-direction:column;gap:16px}
.sheet.on{transform:translate(-50%,0)}
.sheet h3{font-size:22px;font-weight:500}
/* inputs */
.input{width:100%;height:57px;border-radius:16px;border:1px solid var(--line);background:rgba(29,30,33,.6);color:var(--t1);font:inherit;font-size:16px;padding:0 20px;outline:none}
.input:focus{border-color:var(--blue)}
.check{display:flex;gap:10px;align-items:center;font-size:14px;color:var(--t3);cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--blue)}
/* result */
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid rgba(255,255,255,.08)}
.row:first-child{border-top:0}
.row span{flex:1;font-size:15px;color:var(--t2)}
.row em{font-style:normal;font-size:16px}
.row em.blur{filter:blur(5px);user-select:none}
.lock{width:16px;height:16px;flex:none}
.stats{display:flex;gap:12px}
.stats>div{flex:1;padding:16px;border-radius:16px;background:var(--inner)}
.stats small{font-size:14px;color:var(--t3)}.stats p{font-size:30px}
.legend{display:flex;gap:16px;font-size:13px;color:var(--t3)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:3px;border-radius:2px;display:inline-block}
.review{font-size:16px;color:var(--t2)}
.disc{font-size:13px;color:var(--t4);text-align:center}
/* paywall */
.plan{border-radius:20px;padding:20px;border:1px solid var(--line);background:rgba(29,30,33,.6);cursor:pointer;display:flex;flex-direction:column;gap:8px;transition:all .2s}
.plan.on{border:2px solid var(--blue);background:rgba(72,118,238,.16);box-shadow:0 0 24px rgba(72,118,238,.35)}
.plan .hd{display:flex;align-items:center;gap:8px;font-size:18px}
.plan .hd .r{margin-left:auto;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--t5)}
.plan.on .hd .r{background:var(--blue) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='22' height='22'><path d='M6.5 11.2l3 3 6-6.4' stroke='white' stroke-width='2' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>") center/22px no-repeat;border-color:var(--blue)}
.save{padding:4px 10px;border-radius:999px;font-size:13px;background:linear-gradient(90deg,var(--blue),var(--lblue))}
.price{display:flex;align-items:flex-end;gap:6px}.price b{font-size:40px;font-weight:500;line-height:1}.price span{color:var(--t3)}
.strike{text-decoration:line-through;color:var(--t5)}
.plan.small{flex-direction:row;align-items:center;padding:16px 20px}
.plan.small .hd{flex:1;font-size:16px;color:var(--t2)}
.benefit{display:flex;gap:10px;font-size:15px;color:var(--t2);padding:4px 0}
.benefit i{width:20px;height:20px;border-radius:50%;background:rgba(72,118,238,.25);flex:none;display:grid;place-items:center}
.benefit i::after{content:"";width:8px;height:4px;border-left:2px solid var(--lblue);border-bottom:2px solid var(--lblue);transform:rotate(-45deg) translate(1px,-1px)}
.modal{position:fixed;left:50%;top:50%;width:calc(100% - 64px);max-width:376px;transform:translate(-50%,-46%);opacity:0;pointer-events:none;transition:all .3s;z-index:7;border-radius:28px;border:1px solid var(--line);background:rgba(29,30,33,.95);backdrop-filter:blur(24px);padding:28px 24px 20px;display:flex;flex-direction:column;gap:14px;text-align:center}
.modal.on{opacity:1;pointer-events:auto;transform:translate(-50%,-50%)}
.num{width:28px;height:28px;border-radius:50%;background:rgba(72,118,238,.25);color:var(--lblue);display:grid;place-items:center;font-size:14px;flex:none}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.row .num{flex:none}
.celebrate .hero{display:flex;flex-direction:column;align-items:center;gap:14px;padding-top:12px}
.badgebox{position:relative;width:160px;height:160px;flex:none}
.badgebox .ring{position:absolute;left:50%;top:50%;margin:0;border-radius:50%;border:1.5px solid #A2C4FF;transform:translate(-50%,-50%)}
.badgebox .ring.o{width:156px;height:156px;opacity:.18}
.badgebox .ring.i{width:128px;height:128px;opacity:.35;animation:breathe 2.4s ease-in-out 1s infinite}
@keyframes breathe{50%{transform:translate(-50%,-50%) scale(1.08);opacity:.55}}
.badge{position:absolute;left:32px;top:32px;width:96px;height:96px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,#A2C4FF,#4876EE);box-shadow:0 0 40px rgba(72,118,238,.6);animation:pop .6s cubic-bezier(.2,1.4,.4,1) both}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
.tick{stroke-dasharray:40;stroke-dashoffset:40;animation:draw .5s ease-out .45s forwards}
.spark{position:absolute;inset:0;pointer-events:none}
.spark i{position:absolute;left:50%;top:50%;border-radius:50%;opacity:0;animation:burst .9s ease-out calc(.35s + var(--d)) forwards}
@keyframes burst{0%{transform:translate(-50%,-50%);opacity:0}30%{opacity:1}100%{transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y)));opacity:.8}}
.pill.trial{color:var(--t1);background:rgba(72,118,238,.2);border:1px solid rgba(72,118,238,.5);padding:7px 14px;gap:8px}
.pill.trial b{width:6px;height:6px;border-radius:50%;background:var(--lblue);box-shadow:0 0 8px var(--lblue)}
.unlocked{padding:18px 20px 8px}
.unlocked .row{padding:11px 0}
.unlocked .row em{text-align:right}
.unlocked .row.u{opacity:0;animation:rowin .45s ease-out forwards;animation-delay:calc(1s + var(--i)*.18s)}
@keyframes rowin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.stepper{position:relative;display:flex}
.stepper>div{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.stepper p{font-size:13px;color:var(--t2)}
.stepper .dash{position:absolute;top:13px;height:2px;width:calc(33.333% - 44px);background:repeating-linear-gradient(90deg,var(--t5) 0 4px,transparent 4px 8px)}
.stepper .d1{left:calc(16.667% + 22px)}.stepper .d2{left:calc(50% + 22px)}
a.btn{display:flex;align-items:center;justify-content:center;gap:10px;text-decoration:none}
.lang{position:absolute;top:16px;right:16px;z-index:9;display:flex;gap:2px;padding:3px;border-radius:999px;background:rgba(37,38,42,.8)}
.lang button{border:0;border-radius:999px;padding:5px 10px;background:none;color:var(--t3);font:inherit;font-size:12px;cursor:pointer}
.lang button.on{background:var(--blue);color:#fff}
.logo{height:23px;width:auto;display:block}
.ps{position:absolute;top:16px;left:128px;z-index:9;max-width:160px;height:28px;border-radius:999px;border:0;padding:0 10px;background:rgba(37,38,42,.8);color:var(--t2);font:inherit;font-size:12px;cursor:pointer;-webkit-appearance:none;appearance:none}
.vt{position:absolute;top:16px;left:16px;z-index:9;display:flex;gap:2px;padding:3px;border-radius:999px;background:rgba(37,38,42,.8)}
.vt button{border:0;border-radius:999px;padding:5px 10px;background:none;color:var(--t3);font:inherit;font-size:12px;cursor:pointer}
.vt button.on{background:var(--blue);color:#fff}
.scl{display:flex;justify-content:space-between;font-size:13px;color:var(--t4)}.scl b{font-weight:500;color:var(--t1)}
.scale{position:relative;height:20px}
.scale .tr{position:absolute;left:0;right:0;top:7px;height:6px;border-radius:3px;background:rgba(255,255,255,.1)}
.scale .fl{position:absolute;left:0;top:7px;height:6px;width:0;border-radius:3px;background:linear-gradient(90deg,var(--blue),var(--lblue));transition:width .9s cubic-bezier(.2,.8,.2,1)}
.scale .mk{position:absolute;left:0;top:1px;width:18px;height:18px;border-radius:50%;background:#FAFAFA;border:4px solid var(--blue);transform:translateX(-50%);transition:left .9s cubic-bezier(.2,.8,.2,1)}
.stmt{min-height:200px;display:flex;align-items:center;font-size:22px;padding:28px}
.two{display:flex;gap:12px;width:100%}
.btn2{flex:1;height:57px;border-radius:999px;border:1px solid var(--line);background:rgba(37,38,42,.6);color:var(--t1);font:inherit;font-size:16px;display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer;transition:all .15s}
.btn2.on{border:1.5px solid var(--blue);background:rgba(72,118,238,.25)}
.btn2:disabled{cursor:default}.btn2:disabled:not(.on){opacity:.45}
.mrow{display:flex;flex-direction:column;gap:6px;padding:6px 0}.mt{display:flex;justify-content:space-between;font-size:16px}.mt em{font-style:normal}
.mb{height:6px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden}.mb i{display:block;height:100%;width:0;border-radius:3px;transition:width .9s cubic-bezier(.2,.8,.2,1)}
.game{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;min-height:290px}
.tap{width:170px;height:170px;border-radius:50%;background:var(--inner);border:1px solid var(--line);display:grid;place-items:center;text-align:center;padding:16px;color:var(--t3);font-size:16px;cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.tap.go{background:radial-gradient(circle,#A2C4FF,#4876EE);color:#fff;font-size:22px;box-shadow:0 0 40px rgba(72,118,238,.6)}
.vbars{display:flex;align-items:flex-end;gap:12px;min-height:180px}
.vbars>div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;font-size:13px;color:var(--t3);text-align:center}
.vbars i{display:block;width:100%;max-width:36px;height:0;border-radius:8px;background:linear-gradient(var(--lblue),var(--blue));transition:height .8s cubic-bezier(.2,.8,.2,1)}
.fadeup{animation:up .5s ease-out}
.stars{color:#FAFAFA;font-size:18px;letter-spacing:3px}
.timeline{display:flex;flex-direction:column;padding:10px 20px}
.timeline .st{display:flex;gap:14px;padding:10px 0;opacity:0;animation:rowin .45s ease-out forwards;animation-delay:calc(.2s + var(--i)*.15s)}
.timeline .st i{width:10px;height:10px;border-radius:50%;margin-top:6px;flex:none;background:var(--lblue)}
.timeline small{display:block;font-size:14px;color:var(--lblue)}.timeline p{font-size:16px}
.row.u{opacity:0;animation:rowin .45s ease-out forwards;animation-delay:calc(.2s + var(--i)*.12s)}
</style>
</head>

<script>
const I={
en:{
 band:["Morning","Afternoon","Evening","Night"],startTitle:"Redesign<br>your day",startSub:"Your day starts the night before. Answer 10 quick questions and see how your tomorrow could feel.",downloads:"3M+ downloads",startBtn:"Redesign my day",startNote:"2 minutes. Free. No sign-up.",
 painQ:"Which sounds most like you?",painS:"Choose the closest one. We'll build your plan around it.",

 revs:[["My sleep kept getting shorter and more irregular, and I couldn't fix it on my own. I tried the 7-day trial, and for the first time in two months I fell asleep before midnight and woke up refreshed.","ju_______v, App Store Korea (translated from Korean)"],["The first two nights, I slept straight through without getting up for the bathroom, and I felt good in the morning. Before, I'd still be sleepy when I woke up and yawn all morning.","Vickyhsu0302, App Store Taiwan (translated from Chinese)"],["I was skeptical when I started. What changed most was how I wake up: clear-headed, with almost no fatigue.","eeeeeeta.k, App Store Japan (translated from Japanese)"],["I've always had trouble falling asleep. I overthink and get anxious, so it took me 30 to 40 minutes. With the meditation and the beats on, the thoughts stop and I fall asleep fast. I tried one month, and now I'm on the yearly plan.","Yesterda2, App Store Korea (translated from Korean)"],["I'm a nurse and I've worked rotating shifts for 10 years. Falling asleep was hard, and staying asleep was harder. What I like most is that it tells me when to wake up to feel most refreshed, based on when I go to bed.","나나나무무웅, App Store Korea (translated from Korean)"],["I used to feel sleepy on anything less than 8 hours. With this app, 6 or 7 hours is enough and I'm not sleepy.","1ssssssssssttt, App Store Korea (translated from Korean)"]],revE:"From people like you",revT:(p)=>`They picked “${p}” too`,revNote:"Real App Store review. Translated, meaning unchanged.",revLeft:"2 more questions until your plan",

<div class="glass" style="display:flex;flex-direction:column;gap:10px" id="rc"><p style="font-size:18px">${t.fcT}</p><div class="legend"><span><i style="background:#646464"></i>${t.today}</span><span><i style="background:#A2C4FF"></i>${t.tomorrow}</span></div>
<div class="chart"><svg viewBox="0 0 350 180"><defs><linearGradient id="s2" x1="0" x2="350" gradientUnits="userSpaceOnUse"><stop stop-color="#FFC982"/><stop offset=".5" stop-color="#A2C4FF"/><stop offset="1" stop-color="#4876EE"/></linearGradient><linearGradient id="a2" x1="0" y1="20" x2="0" y2="180" gradientUnits="userSpaceOnUse"><stop stop-color="#fff" stop-opacity=".28"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs><path d="${today}" stroke="#646464" stroke-width="2" stroke-dasharray="4 4" fill="none"/><path class="fadein" d="${tom} L350 180 L0 180Z" fill="url(#a2)"/><path class="draw" id="curve2" d="${tom}" stroke="url(#s2)" stroke-width="3" fill="none" stroke-linecap="round"/><circle class="fadein" cx="60" cy="28" r="6" fill="#FFC982"/></svg></div><div class="axis">${t.axis.map(a=>`<span>${a}</span>`).join('')}</div>
<div class="rows" style="border-top:1px solid rgba(255,255,255,.08);margin-top:4px"><div class="row"><span>${t.sharp}</span><em class="blur">${fmt(m24((S.wake??420)+160))}</em>${LOCK}</div><div class="row"><span>${t.slumpTo}</span><em class="blur">${fmt(m24((S.wake??420)+570))}</em>${LOCK}</div></div></div>
<div class="stats"><div><small>${t.debt}</small><p>${debt>0?dur(debt):'0'}</p></div><div><small>${t.fall}</small><p>${t.fallShort[S.fall??2]}</p></div></div>
<div class="glass"><p style="font-size:18px;padding-bottom:4px">${t.planT}</p><div class="rows"><div class="row"><span>${t.bestSleep}</span><em class="blur">${fmt(bestSleep())}</em>${LOCK}</div><div class="row"><span>${t.sound(t.moods[S.mood??1])}</span><em class="blur">${t.ready}</em>${LOCK}</div><div class="row"><span>${t.caffeine}</span><em class="blur">${fmt(m24(bestSleep()-600))}</em>${LOCK}</div><div class="row"><span>${t.sleepNow}</span><em class="blur">+18%</em>${LOCK}</div><div class="row"><span>${t.tmr(fmt(S.wake??420))}</span><em style="color:var(--lblue)">${t.firstFc}</em></div>${LONG&&S.need!==undefined?`<div class="row"><span>${t.plannedFor}</span><em style="color:var(--lblue)">${t.needs[S.need]}</em></div>`:''}${LONG&&S.snore===0?`<div class="row"><span>${t.snoreRow}</span><em style="color:var(--lblue)">${t.on}</em></div>`:''}</div></div>
<div class="glass" style="display:flex;flex-direction:column;gap:8px"><p style="font-size:32px;color:var(--lblue);line-height:.8">“</p><p class="review">${t.revs[S.pain??5][0]}</p><small style="color:var(--t4)">${t.revs[S.pain??5][1]}</small></div>
<button class="btn" onclick="next('result')">${t.unlock}</button><p class="disc">${t.disc}</p></div></div>`;
app.innerHTML=h;prepDraw();return}
case 'paywall':h=`<div class="screen" style="justify-content:flex-start"><div class="top"><div class="header"><button class="back x" onclick="exitModal()">${X}</button></div><div class="q"><h1 style="font-size:30px">${t.payT}</h1><p class="sub">${t.payS}</p></div>
<div style="display:flex;flex-direction:column;gap:12px"><div class="plan on" data-p="y"><div class="hd">${t.yearly}<span class="save">${t.save}</span><i class="r"></i></div><div class="price"><b>$5.00</b><span>${t.perMo}</span></div><div style="display:flex;gap:8px;font-size:15px"><span class="strike">$155.88</span><span style="color:var(--t2)">${t.billed}</span></div><p style="font-size:14px;color:var(--lblue)">${t.trial}</p></div>
<div class="plan small" data-p="m"><div class="hd">${t.monthly}</div><span style="color:var(--t2)">${t.moPrice}</span><i class="r" style="width:22px;height:22px;border-radius:50%;border:1.5px solid var(--t5);margin-left:8px"></i></div></div>
<div class="glass"><p style="font-size:18px;padding-bottom:8px">${t.get}</p>${t.benefits.map(b=>`<div class="benefit"><i></i><span>${b}</span></div>`).join('')}</div>
<div class="glass" style="padding:8px 20px"><div class="rows"><div class="row"><span>${t.tl1[0]}</span><em style="color:var(--lblue);font-size:15px">${t.tl1[1]}</em></div><div class="row"><span>${t.tl2[0]}</span><em style="font-size:15px;color:var(--t2)">${t.tl2[1]}</em></div></div></div>
<button class="btn" onclick="next('paywall')">${t.startTrial}</button><p class="disc">${t.noCharge}</p></div></div>`;app.innerHTML=h;app.querySelectorAll('.plan').forEach(p=>p.onclick=()=>{app.querySelectorAll('.plan').forEach(q=>q.classList.toggle('on',q===p));const r=app.querySelector('.plan.small .r');r.style.background=p.dataset.p==='m'?'var(--blue)':'';r.style.borderColor=p.dataset.p==='m'?'var(--blue)':''});return;
case 'download':{const e=S.email||'you@email.com',sp=Array.from({length:10},(_,i)=>{const a=i/10*Math.PI*2+.3,r=70+(i%2)*8;return `<i style="--x:${(Math.cos(a)*r).toFixed(0)}px;--y:${(Math.sin(a)*r).toFixed(0)}px;--d:${(i%5)*.12}s;background:${['#A2C4FF','#FFC982','#4876EE','#FAFAFA'][i%4]};width:${i%3===0?6:4}px;height:${i%3===0?6:4}px"></i>`}).join('');
h=`<div class="screen celebrate"><div class="top"><div class="header"></div>
<div class="hero"><div class="badgebox"><span class="ring o"></span><span class="ring i"></span><div class="badge"><svg width="44" height="44" viewBox="0 0 44 44" fill="none"><path class="tick" d="M12 23l7 7 14-15" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg></div></div>
<span class="pill trial"><b></b>${t.trialOn}</span><h1 style="font-size:34px;text-align:center">${t.celebT}</h1><p class="sub" style="text-align:center">${t.celebS}</p></div>
<div class="glass unlocked"><p style="font-size:18px;padding-bottom:4px;display:flex;gap:8px;align-items:center"><svg width="18" height="18" viewBox="0 0 16 16" fill="none"><rect x="3" y="7" width="10" height="7" rx="2" fill="#A2C4FF"/><path d="M5.5 7V5a2.5 2.5 0 015-.6" stroke="#A2C4FF" stroke-width="1.5" stroke-linecap="round"/></svg>${t.unlockedT}</p><div class="rows">
<div class="row u" style="--i:0"><span>${t.bestSleep}</span><em>${fmt(bestSleep())}</em></div>
<div class="row u" style="--i:1"><span>${t.sound(t.moods[S.mood??1])}</span><em style="color:var(--lblue)">${t.ready}</em></div>
<div class="row u" style="--i:2"><span>${t.caffeine}</span><em>${fmt(m24(bestSleep()-600))}</em></div>
<div class="row u" style="--i:3"><span>${t.tmr(fmt(S.wake??420))}</span><em style="color:var(--sun)">${t.firstFc}</em></div></div></div>
<div class="stepper"><i class="dash d1"></i><i class="dash d2"></i>${t.stepsShort.map((x,i)=>`<div><span class="num">${i+1}</span><p>${x}</p></div>`).join('')}</div></div>
<div class="bottom"><a class="btn store" href="https://apps.apple.com/us/app/renight-ai-sleep-sounds/id1619362440" target="_blank" rel="noopener"><svg width="18" height="22" viewBox="0 0 17 20" fill="#fff"><path d="M14.1 10.6c0-2.6 2.1-3.8 2.2-3.9-1.2-1.8-3.1-2-3.7-2-1.6-.2-3.1.9-3.9.9-.8 0-2-.9-3.4-.9-1.7 0-3.3 1-4.2 2.6-1.8 3.1-.5 7.7 1.3 10.2.9 1.2 1.9 2.6 3.2 2.6 1.3-.1 1.8-.8 3.3-.8 1.6 0 2 .8 3.4.8 1.4 0 2.3-1.3 3.1-2.5 1-1.4 1.4-2.8 1.4-2.9-.1 0-2.7-1-2.7-4.1zM11.6 3c.7-.9 1.2-2 1-3.2-1 0-2.2.7-2.9 1.5-.6.7-1.2 1.9-1 3.1 1.1.1 2.2-.6 2.9-1.4z"/></svg>${t.getApp}</a><p class="note">${t.savedTo(e)}</p></div></div>`;break}}
app.innerHTML=h;bindScreen();}
function bindScreen(){const auto={pain:'pain',snooze:'snooze',low:'low',me:'me',fall:'fall',mood:'mood',free:'free',morn:'morn',need:'need',wk:'weekend',caff:'caff'};
 if(auto[cur]){const id=cur;bindSingle(auto[cur],()=>next(id))}
 if(cur==='pain'){app.querySelector('#none').onclick=()=>{S.pain=5;next('pain')}}
 if(cur==='age'){const box=app.querySelector('.opts[data-key="age"]');box.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;S.age=i;box.querySelectorAll('.opt').forEach(o=>o.classList.toggle('on',o===b));const emp=app.querySelector('#emp'),btn=app.querySelector('#cont');if(i===0){emp.innerHTML='';btn.style.visibility='hidden';box.classList.add('locked');setTimeout(()=>go('teen'),600);return}emp.innerHTML=`<div class="empathy"><p>${L().emp[i-1]}</p><small>${L().src}</small></div>`;btn.style.visibility='visible'});if(S.age>0)box.querySelector(`.opt[data-i="${S.age}"]`).click()}
 if(cur==='wakes')bindMulti('wakes');
 if(cur==='goal')bindMulti('goal',-1);
 if(cur==='tried')bindMulti('tried',5);}
function goalText(){const g=(S.goal||[])[0];return g===undefined?L().goalShort[0]:L().goalShort[g]}
function clockInfo(){const fw=[390,450,510,570,630][S.free??2],ty=fw<420?0:fw<540?1:2,g=fw-(S.wake??420),pos=Math.min(1,Math.max(0,(fw-360)/300));return {fw,ty,g,pos}}
function CMP(t){return `<div class="glass cmp"><div><div class="barbox"><div class="bar" style="background:${LONG?'rgba(143,143,143,.55)':'var(--inner)'}" data-h="36"></div></div><p>${t.own}</p><small>${t.ownD}</small></div><div><div class="barbox"><div class="bar" style="background:linear-gradient(#A2C4FF,#4876EE)" data-h="96"></div></div><p>${t.withR}</p><small>${t.withD}</small></div></div>`}
function runGame(){const t=L(),tap=app.querySelector('#tap'),rd=app.querySelector('#rd'),btn=app.querySelector('#gst'),sk=app.querySelector('#gskip');let round=0,times=[],t0=0,timer=null,state='idle';
 const arm=()=>{if(cur!=='game')return;state='wait';tap.className='tap';tap.textContent=t.waitBlue;rd.textContent=t.round(round+1);timer=setTimeout(()=>{if(cur!=='game')return;state='go';tap.className='tap go';tap.textContent=t.tapNow;t0=performance.now()},1000+Math.random()*1800)};
 btn.onclick=()=>{btn.style.visibility='hidden';round=0;times=[];arm()};
 sk.onclick=()=>{clearTimeout(timer);S.rt=S.rt||[298,341,305,290,326];next('game')};
 tap.onpointerdown=()=>{if(state==='wait'){clearTimeout(timer);state='early';tap.className='tap';tap.textContent=t.tooSoon;setTimeout(arm,900)}else if(state==='go'){const ms=Math.round(performance.now()-t0);times.push(ms);state='done';tap.className='tap';tap.textContent=ms+' ms';round++;if(round>=5){S.rt=times;setTimeout(()=>{if(cur==='game')next('game')},800)}else setTimeout(arm,700)}}}
function runLoading(){const arc=app.querySelector('#arc'),pct=app.querySelector('#pct'),steps=[...app.querySelectorAll('.step')],C=477.5;let p=0;const set=v=>{p=v;arc.style.strokeDashoffset=C*(1-v/100);pct.textContent=Math.round(v)+'%';steps.forEach((s,i)=>s.classList.toggle('done',v>=[25,50,75,100][i]))};
 const anim=(from,to,ms,cb)=>{const t0=performance.now();const f=now=>{if(cur!=='loading')return;const k=Math.min(1,(now-t0)/ms);set(from+(to-from)*(1-Math.pow(1-k,2)));k<1?requestAnimationFrame(f):cb&&cb()};requestAnimationFrame(f)};
 anim(0,85,2600,()=>{dim.classList.add('on');const sh=document.createElement('div');sh.className='sheet';const sk=LONG?'snore':'weekend';sh.innerHTML=`<p class="sub" style="font-size:14px">${L().sheetE}</p><h3>${LONG?L().snoreQ:L().sheetQ}</h3>${opts(LONG?L().snores:L().weekends,sk)}`;document.body.appendChild(sh);requestAnimationFrame(()=>sh.classList.add('on'));
  sh.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{S[sk]=+b.dataset.i;sh.querySelectorAll('.opt').forEach(o=>o.classList.toggle('on',o===b));sh.querySelector('.opts').classList.add('locked');setTimeout(()=>{sh.classList.remove('on');dim.classList.remove('on');setTimeout(()=>sh.remove(),400);anim(85,100,900,()=>setTimeout(()=>{if(cur==='loading')next('loading')},600))},600)})})}
function exitModal(){dim.classList.add('on');const m=document.createElement('div');m.className='modal';const t=L();m.innerHTML=`<h1 style="font-size:24px">${t.exitT}</h1><p class="body">${t.exitB}</p><button class="btn" id="keep">${t.keep}</button><button class="link" id="leave">${t.leave}</button>`;document.body.appendChild(m);requestAnimationFrame(()=>m.classList.add('on'));m.querySelector('#keep').onclick=()=>{m.classList.remove('on');dim.classList.remove('on');setTimeout(()=>m.remove(),300)};m.querySelector('#leave').onclick=restart}
function restart(){for(const k in S)delete S[k];hist=[];go('start',false)}
document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>{lang=b.dataset.l;closeOverlays();render()});
document.getElementById('ps').onchange=e=>{const i=+e.target.value;if(!i)return;for(const k in S)delete S[k];Object.assign(S,JSON.parse(JSON.stringify(PERSONAS[i-1])));closeOverlays();render()};
document.querySelectorAll('.vt button').forEach(b=>{b.onclick=()=>{const u=new URL(location.href);if(b.dataset.v==='long')u.searchParams.set('ver','long');else u.searchParams.delete('ver');u.searchParams.set('lang',lang);u.hash='';location.href=u.toString()}});
if(location.hash){const h=location.hash.slice(1);if(ORDER.includes(h)||h==='teen')cur=h}
render();
</script>
